        // END UHR_PROGRAM_BASE64

        const sourcesB64 = {
            timer: TIMER_PROGRAM_BASE64,
            stoppuhr: STOPPUHR_PROGRAM_BASE64,
            uhr: UHR_PROGRAM_BASE64
        };

        const SHARED_THEME_KEY = 'modularProgramsThemeMode';
        const SHARED_LANGUAGE_KEY = 'modularProgramsLanguage';
        const SHARED_ANALOG_MODE_KEY = 'modularProgramsAnalogMode';
        const STOPPUHR_SETTINGS_KEY = 'stoppuhrMitHintergrundmusikSettingsV1';
        let hasLoadedProgramOnce = false;

        function getStoredThemeMode() {
            const mode = localStorage.getItem(SHARED_THEME_KEY);
            return mode === 'dark' || mode === 'light' ? mode : null;
        }

        function getStoredLanguage() {
            const lang = localStorage.getItem(SHARED_LANGUAGE_KEY);
            return lang === 'de' || lang === 'en' ? lang : null;
        }

        function getStoredAnalogMode() {
            const value = localStorage.getItem(SHARED_ANALOG_MODE_KEY);
            if (value === 'true') return true;
            if (value === 'false') return false;
            return null;
        }

        function storeThemeMode(mode) {
            if (mode === 'dark' || mode === 'light') {
                localStorage.setItem(SHARED_THEME_KEY, mode);
            }
        }

        function storeLanguage(lang) {
            if (lang === 'de' || lang === 'en') {
                localStorage.setItem(SHARED_LANGUAGE_KEY, lang);
                // Keep legacy keys in sync so each embedded app boots with the same language.
                localStorage.setItem('appLanguage', lang);
                localStorage.setItem('timerLanguage', lang);
            }
        }

        function storeAnalogMode(enabled) {
            if (typeof enabled === 'boolean') {
                localStorage.setItem(SHARED_ANALOG_MODE_KEY, String(enabled));

                // Stoppuhr persists analog mode inside its settings object.
                let data = {};
                try {
                    const raw = localStorage.getItem(STOPPUHR_SETTINGS_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && typeof parsed === 'object') {
                            data = parsed;
                        }
                    }
                } catch (_error) {
                    data = {};
                }
                data.analogMode = enabled;
                localStorage.setItem(STOPPUHR_SETTINGS_KEY, JSON.stringify(data));
            }
        }

        function detectThemeMode(doc) {
            if (!doc || !doc.body) return null;
            return doc.body.classList.contains('dark-mode') ? 'dark' : 'light';
        }

        function detectLanguage(doc) {
            if (!doc || !doc.documentElement) return null;

            const htmlLang = (doc.documentElement.lang || '').toLowerCase();
            if (htmlLang.startsWith('de')) return 'de';
            if (htmlLang.startsWith('en')) return 'en';

            const langBtn = doc.querySelector('#languageToggleBtn');
            if (!langBtn) return null;
            const label = (langBtn.textContent || '').trim().toLowerCase();
            if (label === 'de') return 'de';
            if (label === 'en') return 'en';

            return null;
        }

        function detectAnalogMode(doc) {
            if (!doc || !doc.body) return null;

            if (doc.body.classList.contains('analog-mode')) return true;

            const timerContainer = doc.getElementById('timerContainer');
            if (timerContainer && timerContainer.classList.contains('analog-mode')) {
                return true;
            }

            const analogStatus = doc.getElementById('analogModeStatus');
            if (analogStatus) {
                const statusText = (analogStatus.textContent || '').trim().toLowerCase();
                if (statusText === 'ein' || statusText === 'on') return true;
                if (statusText === 'aus' || statusText === 'off') return false;
            }

            return false;
        }

        function applyThemeMode(doc, mode) {
            if (!doc || !doc.body || (mode !== 'dark' && mode !== 'light')) return;

            const wantsDark = mode === 'dark';
            const win = doc.defaultView;

            const syncPaletteIfNeeded = () => {
                if (!win || typeof win.resetColors !== 'function') return;
                if (typeof win.isDefaultPaletteActive === 'function') {
                    if (win.isDefaultPaletteActive()) {
                        win.resetColors();
                    }
                    return;
                }
                // No fallback reset here: pages without this helper (timer/uhr)
                // may use manual color choices that must stay untouched.
            };

            if (win && typeof win.setDarkModeState === 'function') {
                win.setDarkModeState(wantsDark);
                syncPaletteIfNeeded();
                return;
            }

            const isDark = doc.body.classList.contains('dark-mode');
            if (isDark !== wantsDark && win && typeof win.toggleDarkMode === 'function') {
                win.toggleDarkMode();
                syncPaletteIfNeeded();
                return;
            }

            doc.body.classList.toggle('dark-mode', wantsDark);
            syncPaletteIfNeeded();
        }

        function applyLanguage(doc, lang) {
            if (!doc || (lang !== 'de' && lang !== 'en')) return;

            const current = detectLanguage(doc);
            if (current === lang) return;

            const win = doc.defaultView;
            if (win && typeof win.toggleLanguage === 'function') {
                win.toggleLanguage();
                return;
            }

            if (doc.documentElement) {
                doc.documentElement.lang = lang;
            }

            const langBtn = doc.getElementById('languageToggleBtn');
            if (langBtn) {
                langBtn.textContent = lang.toUpperCase();
            }
        }

        function applyAnalogMode(doc, enabled) {
            if (!doc || typeof enabled !== 'boolean') return;

            const current = detectAnalogMode(doc);
            if (current === enabled) return;

            const win = doc.defaultView;
            if (win && typeof win.toggleAnalogMode === 'function') {
                win.toggleAnalogMode();
                return;
            }

            if (doc.body) {
                doc.body.classList.toggle('analog-mode', enabled);
            }
            const timerContainer = doc.getElementById('timerContainer');
            if (timerContainer) {
                timerContainer.classList.toggle('analog-mode', enabled);
            }
        }

        function syncThemeToLoadedProgram(doc) {
            const storedMode = getStoredThemeMode();
            if (storedMode) {
                applyThemeMode(doc, storedMode);
            } else {
                // First-load default: always start in dark mode until user changes it.
                storeThemeMode('dark');
                applyThemeMode(doc, 'dark');
            }
        }

        function ensureDefaultThemeMode() {
            // Always start in dark mode on page reload.
            storeThemeMode('dark');

            // Keep stopwatch-specific persisted dark-mode state aligned.
            let data = {};
            try {
                const raw = localStorage.getItem(STOPPUHR_SETTINGS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') {
                        data = parsed;
                    }
                }
            } catch (_error) {
                data = {};
            }
            data.darkMode = true;
            localStorage.setItem(STOPPUHR_SETTINGS_KEY, JSON.stringify(data));
        }

        function syncSharedStateToLoadedProgram(doc) {
            syncThemeToLoadedProgram(doc);

            const storedLanguage = getStoredLanguage();
            if (storedLanguage) {
                applyLanguage(doc, storedLanguage);
            } else {
                storeLanguage(detectLanguage(doc));
            }

            const storedAnalogMode = getStoredAnalogMode();
            if (storedAnalogMode !== null) {
                applyAnalogMode(doc, storedAnalogMode);
            } else {
                storeAnalogMode(detectAnalogMode(doc));
            }
        }

        function captureSharedStateFromLoadedProgram() {
            const doc = frame.contentDocument;
            if (!doc) return;

            storeThemeMode(detectThemeMode(doc));
            storeLanguage(detectLanguage(doc));
            storeAnalogMode(detectAnalogMode(doc));
        }

        function mirrorSharedStateToProgramStorage(programKey) {
            const sharedLanguage = getStoredLanguage();
            if (sharedLanguage) {
                storeLanguage(sharedLanguage);
            }

            const sharedAnalogMode = getStoredAnalogMode();
            if (sharedAnalogMode === null) return;

            if (programKey === 'stoppuhr') {
                storeAnalogMode(sharedAnalogMode);
            }
        }

        function enforceSharedStateAfterLoad(doc) {
            const syncIfStillActive = () => {
                if (frame.contentDocument !== doc) return;
                syncSharedStateToLoadedProgram(doc);
            };

            syncIfStillActive();
            setTimeout(syncIfStillActive, 50);
            setTimeout(syncIfStillActive, 220);
            setTimeout(syncIfStillActive, 500);
            setTimeout(syncIfStillActive, 900);
            setTimeout(syncIfStillActive, 1400);
        }

        function bindThemePersistence(doc) {
            if (!doc) return;

            const persistTheme = () => {
                const mode = detectThemeMode(doc);
                storeThemeMode(mode);
            };

            ['#darkModeToggleBtn', '#darkModeBtn'].forEach((selector) => {
                const btn = doc.querySelector(selector);
                if (!btn) return;
                btn.addEventListener('click', () => {
                    setTimeout(persistTheme, 0);
                }, true);
            });

            if (doc.body && typeof MutationObserver !== 'undefined') {
                const observer = new MutationObserver(() => {
                    persistTheme();
                });
                observer.observe(doc.body, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
        }

        function bindSharedStatePersistence(doc) {
            if (!doc) return;

            const persistAll = () => {
                storeThemeMode(detectThemeMode(doc));
                storeLanguage(detectLanguage(doc));
                storeAnalogMode(detectAnalogMode(doc));
            };

            ['#languageToggleBtn', '#analogModeBtn'].forEach((selector) => {
                const btn = doc.querySelector(selector);
                if (!btn) return;
                btn.addEventListener('click', () => {
                    setTimeout(persistAll, 0);
                }, true);
            });

            if (doc.body && typeof MutationObserver !== 'undefined') {
                const observer = new MutationObserver(() => {
                    persistAll();
                });
                observer.observe(doc.body, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }

            if (doc.documentElement && typeof MutationObserver !== 'undefined') {
                const langObserver = new MutationObserver(() => {
                    persistAll();
                });
                langObserver.observe(doc.documentElement, {
                    attributes: true,
                    attributeFilter: ['lang']
                });
            }

            const timerContainer = doc.getElementById('timerContainer');
            if (timerContainer && typeof MutationObserver !== 'undefined') {
                const timerObserver = new MutationObserver(() => {
                    persistAll();
                });
                timerObserver.observe(timerContainer, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
        }

        function decodeBase64Utf8(base64Value) {
            const binary = atob(base64Value);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        function getProgramKeyFromButton(button) {
            const label = (button.textContent || '').trim().toLowerCase();
            if (label.includes('timer')) return 'timer';
            if (label.includes('stoppuhr')) return 'stoppuhr';
            if (label.includes('uhr')) return 'uhr';

            const onclick = (button.getAttribute('onclick') || '').toLowerCase();
            if (onclick.includes('timer mit hintergrundmusik.html')) return 'timer';
            if (onclick.includes('stoppuhr mit hintergrundmusik.html')) return 'stoppuhr';
            if (onclick.includes('uhr.html')) return 'uhr';

            return null;
        }

        function loadProgram(program, pushHash = true) {
            if (hasLoadedProgramOnce) {
                captureSharedStateFromLoadedProgram();
            }
            const key = Object.prototype.hasOwnProperty.call(sourcesB64, program) ? program : 'timer';
            mirrorSharedStateToProgramStorage(key);
            frame.srcdoc = decodeBase64Utf8(sourcesB64[key]);
            if (pushHash) {
                history.replaceState(null, '', '#' + key);
            }
        }

        function bindEmbeddedNavigation() {
            const doc = frame.contentDocument;
            if (!doc) return;
            hasLoadedProgramOnce = true;

            enforceSharedStateAfterLoad(doc);

            const navButtons = doc.querySelectorAll('.toolbar-nav-btn');
            navButtons.forEach((btn) => {
                const target = getProgramKeyFromButton(btn);
                if (!target) return;

                btn.removeAttribute('onclick');
                btn.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    loadProgram(target);
                }, true);
            });

            bindThemePersistence(doc);
            bindSharedStatePersistence(doc);
        }

        let tabClockIntervalId = null;
        let tabClockListenersBound = false;

        function startTabClock() {
            const baseTitle = 'Onlinetime';
            const titleByProgram = {
                de: {
                    timer: 'Timer',
                    stoppuhr: 'Stoppuhr',
                    uhr: 'Uhr'
                },
                en: {
                    timer: 'Timer',
                    stoppuhr: 'Stopwatch',
                    uhr: 'Clock'
                }
            };
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const ensureFavicon = () => {
                let link = document.getElementById('liveClockFavicon');
                if (!link) {
                    link = document.createElement('link');
                    link.id = 'liveClockFavicon';
                    link.rel = 'icon';
                    link.type = 'image/png';
                    document.head.appendChild(link);
                }
                return link;
            };

            const getActiveLanguageForTitle = () => {
                const shared = getStoredLanguage();
                if (shared === 'de' || shared === 'en') return shared;

                const appLang = localStorage.getItem('appLanguage');
                if (appLang === 'de' || appLang === 'en') return appLang;

                const timerLang = localStorage.getItem('timerLanguage');
                if (timerLang === 'de' || timerLang === 'en') return timerLang;

                return 'de';
            };

            const updateTabIndicators = () => {
                const now = new Date();
                const currentProgram = (location.hash || '#timer').slice(1);
                const lang = getActiveLanguageForTitle();
                const titles = titleByProgram[lang] || titleByProgram.de;
                const currentProgramTitle = titles[currentProgram] || titles.timer;
                document.title = baseTitle + ' | ' + currentProgramTitle;

                const activeDoc = frame.contentDocument;
                const mode = detectThemeMode(activeDoc);
                const isDark = mode === 'dark';
                const palette = isDark
                    ? {
                        face: '#1e1e2f',
                        border: '#4a5a9e',
                        marks: '#e0e0e0',
                        hourMinute: '#e0e0e0',
                        second: '#ff6b6b',
                        center: '#4a5a9e'
                    }
                    : {
                        face: '#ffffff',
                        border: '#667eea',
                        marks: '#333333',
                        hourMinute: '#111111',
                        second: '#d64545',
                        center: '#667eea'
                    };

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const cx = 32;
                const cy = 32;
                const radius = 28;

                ctx.fillStyle = palette.face;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = palette.border;
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.strokeStyle = palette.marks;
                ctx.lineWidth = 2;
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
                    const x1 = cx + Math.cos(angle) * 21;
                    const y1 = cy + Math.sin(angle) * 21;
                    const x2 = cx + Math.cos(angle) * 25;
                    const y2 = cy + Math.sin(angle) * 25;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                const hours = now.getHours() % 12;
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                const hourAngle = ((hours + minutes / 60) / 12) * Math.PI * 2 - Math.PI / 2;
                const minuteAngle = ((minutes + seconds / 60) / 60) * Math.PI * 2 - Math.PI / 2;
                const secondAngle = (seconds / 60) * Math.PI * 2 - Math.PI / 2;

                ctx.strokeStyle = palette.hourMinute;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(hourAngle) * 12, cy + Math.sin(hourAngle) * 12);
                ctx.stroke();

                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(minuteAngle) * 18, cy + Math.sin(minuteAngle) * 18);
                ctx.stroke();

                ctx.strokeStyle = palette.second;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(secondAngle) * 22, cy + Math.sin(secondAngle) * 22);
                ctx.stroke();

                ctx.fillStyle = palette.center;
                ctx.beginPath();
                ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ensureFavicon().href = canvas.toDataURL('image/png');
            };

            if (tabClockIntervalId !== null) {
                clearInterval(tabClockIntervalId);
            }

            updateTabIndicators();
            tabClockIntervalId = setInterval(updateTabIndicators, 1000);

            if (!tabClockListenersBound) {
                document.addEventListener('visibilitychange', updateTabIndicators);
                window.addEventListener('focus', updateTabIndicators);
                window.addEventListener('pageshow', updateTabIndicators);
                window.addEventListener('hashchange', updateTabIndicators);
                tabClockListenersBound = true;
            }
        }

        frame.addEventListener('load', bindEmbeddedNavigation);

        window.addEventListener('hashchange', () => {
            loadProgram((location.hash || '#timer').slice(1), false);
        });

        ensureDefaultThemeMode();
        startTabClock();
        loadProgram((location.hash || '#timer').slice(1), false);
    </script>
</body>
</html>
